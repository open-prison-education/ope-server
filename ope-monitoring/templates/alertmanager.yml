global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: email
      match:
        severity: critical
      repeat_interval: 1h

receivers:
  - name: default
  - name: email
    email_configs:
      - to: "<ALERT_EMAIL>"
        from: "alertmanager@<DOMAIN>"
        smarthost: "localhost:25"
        require_tls: false
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
