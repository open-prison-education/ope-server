global:
  resolve_timeout: 5m

route:
# #IF <ALERT_SMTP_SMARTHOST>
  # Send warnings and critical alerts to email. The child route gives critical
  # alerts a shorter repeat interval.
  receiver: email
# #ELSE
  receiver: default
# #ENDIF <ALERT_SMTP_SMARTHOST>
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
# #IF <ALERT_SMTP_SMARTHOST>
  routes:
    - receiver: email
      match:
        severity: critical
      repeat_interval: 1h
# #ENDIF <ALERT_SMTP_SMARTHOST>

receivers:
  - name: default
# #IF <ALERT_SMTP_SMARTHOST>
  - name: email
    email_configs:
      - to: "<ALERT_EMAIL>"
        from: "<ALERT_SMTP_FROM>"
        smarthost: "<ALERT_SMTP_SMARTHOST>"
        hello: "<DOMAIN>"
        require_tls: <ALERT_SMTP_REQUIRE_TLS>
        auth_username: "<ALERT_SMTP_USERNAME>"
        auth_password: "<ALERT_SMTP_PASSWORD>"
        send_resolved: true
# #ENDIF <ALERT_SMTP_SMARTHOST>

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
