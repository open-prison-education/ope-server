bind 0.0.0.0
# Canvas, jobs, MathMan, and SMC connect over the Docker network with no
# password. Protected mode would accept only loopback and crash MathMan.
protected-mode no
port 6379
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
dbfilename dump.rdb
dir /data
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly no
