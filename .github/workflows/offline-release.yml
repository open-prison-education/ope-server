# .github/workflows/offline-release.yml
#
# Publishes the offline bundle as a GitHub Release. See
# docs/OFFLINE_DISTRIBUTION.md for how to run it.
#
# A manual run from main, with the tag input empty, tags the selected commit
# as the next yy.mm.dd.build (UTC, no zero padding, for example 26.11.6.0)
# and publishes that release. A manual run that names an existing tag
# rebuilds that release and does not mint a new number. Pushing a version
# tag publishes that tag. Pushing a tag the remote already has does not
# start a run.
#
# Images are pulled from GHCR, never built here. An image archive at or over
# 2 GiB is left off the release and recorded in manifest.json. The server
# tarball still has to be under 2 GiB. Archives are not split.
#
# A rebuild leaves the published release in place until the new draft has
# every asset, then deletes the old release and publishes the draft. Uploads
# target the draft by release id so they cannot land on the old release.
#
# Optional secret: GHCR_READ_TOKEN
#   A token with read:packages, only needed if GITHUB_TOKEN cannot pull a
#   private package owned by another repository.

name: Offline release

run-name: >-
  Offline release ${{
    (github.event_name == 'workflow_dispatch' && github.event.inputs.tag)
    || (github.event_name == 'push' && github.ref_name)
    || format('from {0}', github.ref_name)
  }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing yy.mm.dd.build tag to rebuild. Leave empty to tag the latest commit on main.'
        required: false
        type: string
        default: ''
  push:
    tags:
      - '[0-9][0-9].[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: read

# A manual rebuild names the tag, so it queues with a push of that same tag.
# A manual run with an empty input queues with other runs on that branch.
concurrency:
  group: >-
    offline-release-${{
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag)
      || github.ref_name
    }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  # GitHub rejects release files of 2 GiB or more.
  MAX_ASSET_BYTES: 2147483648
  # Image archives at or over the limit are named here. This workflow does
  # not upload to that host.
  DOWNLOAD_SITE: https://dl.corrections.sbctc.edu/releases

jobs:
  tag:
    name: Resolve version tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: offline-release-tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # this run carries on into the build instead of the tag trigger firing.
      - name: Resolve or create the version tag
        id: next
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          input_tag="$(printf '%s' "$INPUT_TAG" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -n "$input_tag" ]; then
            if ! printf '%s\n' "$input_tag" | grep -Eq '^[0-9][0-9]\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag '${input_tag}' is not a yy.mm.dd.build tag."
              exit 1
            fi
            if ! git ls-remote --exit-code --tags --refs origin "refs/tags/${input_tag}" >/dev/null; then
              echo "::error::Tag ${input_tag} is not on the remote. Leave the input empty to publish a new release."
              exit 1
            fi
            echo "Rebuilding existing tag ${input_tag}."
            echo "tag=${input_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main. It was started from ${GITHUB_REF}."
            exit 1
          fi

          prefix="$(date -u +%y).$(date -u +%-m).$(date -u +%-d)"
          prefix_re="${prefix//./\\.}"

          for attempt in 1 2 3 4 5; do
            last="$(git ls-remote --tags --refs origin \
              | awk '{ sub("^refs/tags/", "", $2); print $2 }' \
              | { grep -E "^${prefix_re}\.[0-9]+$" || true; } \
              | awk -F. '{ print $4 }' | sort -n | tail -1)"
            build=$(( ${last:--1} + 1 ))
            tag="${prefix}.${build}"
            echo "Tagging ${GITHUB_SHA} as ${tag}."
            if git push origin "${GITHUB_SHA}:refs/tags/${tag}"; then
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push of ${tag} was rejected; retry ${attempt}/5." >&2
            sleep $(( attempt * 3 ))
          done
          echo "::error::Could not push a ${prefix}.N tag."
          exit 1

  draft:
    name: Create draft release
    needs: tag
    if: >-
      !cancelled() &&
      (needs.tag.result == 'success' ||
       (needs.tag.result == 'skipped' && github.event_name == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      archives: ${{ steps.archives.outputs.archives }}
      release_id: ${{ steps.release.outputs.release_id }}
      previous_release_id: ${{ steps.release.outputs.previous_release_id }}
      draft_tag: ${{ steps.release.outputs.draft_tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$DISPATCH_TAG"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release tag was resolved."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: List image archives
        id: archives
        run: |
          set -euo pipefail
          archives="$(./scripts/export_images.sh --list | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "archives=${archives}" >> "$GITHUB_OUTPUT"
          echo "Archives: ${archives}"

      # A published release for this tag stays up until finalize has every
      # asset on the new draft. GitHub allows one release per tag, so the
      # replacement is created under a temporary tag name and later moved.
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

          # --slurp wraps each page, so .[][] is every release. jq -r keeps the
          # ids unquoted. A failed list aborts before a draft is created.
          gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" > /tmp/releases.json
          previous_id=""
          rows="$(jq -r --arg tag "$TAG" \
            '.[][] | select(.tag_name == $tag) | "\(.id) \(.draft)"' /tmp/releases.json)"
          if [ -n "$rows" ]; then
            while read -r id is_draft; do
              [ -z "$id" ] && continue
              if [ "$is_draft" = "true" ]; then
                echo "Deleting leftover draft ${id} for ${TAG}."
                gh api -X DELETE "repos/${GH_REPO}/releases/${id}" >/dev/null
              else
                if [ -n "$previous_id" ]; then
                  echo "::error::More than one published release is attached to ${TAG}."
                  exit 1
                fi
                previous_id="$id"
                echo "Keeping published release ${id} for ${TAG} until the new draft is complete."
              fi
            done <<<"$rows"
          fi

          # Abandoned rebuild drafts are safe to drop only while the published
          # release is still there. If it is already gone, a temp-tag draft may
          # be the only copy of the assets, so leave it.
          leftover="$(jq -r --arg tag "$TAG" \
            '.[][] | select(.draft and .name == $tag and (.tag_name | startswith("offline-rebuild-"))) | .id' \
            /tmp/releases.json)"
          if [ -n "$previous_id" ]; then
            if [ -n "$leftover" ]; then
              while read -r id; do
                [ -z "$id" ] && continue
                echo "Deleting leftover rebuild draft ${id}."
                gh api -X DELETE "repos/${GH_REPO}/releases/${id}" >/dev/null
              done <<<"$leftover"
            fi
          elif [ -n "$leftover" ]; then
            echo "::warning::Unpublished rebuild draft(s) for ${TAG} were left in place: ${leftover//$'\n'/ }"
          fi

          if [ -n "$previous_id" ]; then
            draft_tag="offline-rebuild-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "Creating draft ${draft_tag} to replace release ${previous_id}."
          else
            draft_tag="$TAG"
            echo "Creating draft release ${TAG}."
          fi

          cat > /tmp/notes.md << EOF
          Offline bundle for OPE Server ${TAG} (commit ${commit}).

          Download \`ope-server-offline.tar.gz\` and every image archive you need, then follow
          [docs/OFFLINE_DEPLOYMENT.md](${GITHUB_SERVER_URL}/${GH_REPO}/blob/${TAG}/docs/OFFLINE_DEPLOYMENT.md).
          Check downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`. \`manifest.json\` lists the image refs, digests, and sizes in each archive. An entry with \`"omitted": true\` is not attached; download that file from its \`location\`.
          EOF

          # Do not set target_commitish. For an existing tag GitHub uses that
          # tag. For the temporary name it uses the default branch, which
          # avoids the workflow-scope 404 GITHUB_TOKEN gets when the target
          # commit differs under .github/workflows/. Finalize points the
          # draft at the real tag before publishing. A draft does not create
          # its git tag.
          release_id="$(jq -n \
            --arg tag_name "$draft_tag" \
            --arg name "$TAG" \
            --rawfile body /tmp/notes.md \
            '{tag_name: $tag_name, name: $name, body: $body, draft: true, prerelease: false}' \
            | gh api -X POST "repos/${GH_REPO}/releases" --input - --jq .id)"
          if [ -z "$release_id" ]; then
            echo "::error::GitHub did not return a release id."
            exit 1
          fi

          {
            echo "release_id=${release_id}"
            echo "previous_release_id=${previous_id}"
            echo "draft_tag=${draft_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Draft release id ${release_id} (tag name ${draft_tag})."

  bundle:
    name: Server bundle
    needs: draft
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      FILE: ope-server-offline.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.draft.outputs.tag }}

      - name: Build ope-server-offline.tar.gz
        run: ./scripts/bundle_runtime.sh --arch x86_64

      - name: Check size and write manifest entry
        run: |
          set -euo pipefail
          size="$(stat -c %s "$FILE")"
          echo "${FILE}: ${size} bytes"
          if [ "$size" -ge "$MAX_ASSET_BYTES" ]; then
            echo "::error::${FILE} is ${size} bytes, at or over the 2 GiB release asset limit."
            exit 1
          fi
          mkdir -p manifest
          jq -n --arg file "$FILE" --argjson size "$size" \
            --arg sha256 "$(sha256sum "$FILE" | cut -d' ' -f1)" \
            '{file: $file, size: $size, sha256: $sha256, images: []}' > "manifest/${FILE}.json"

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/upload_release_asset.sh "$RELEASE_ID" "$FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ env.FILE }}
          path: manifest/
          retention-days: 7

  images:
    name: Images ${{ matrix.archive }}
    needs: draft
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        archive: ${{ fromJSON(needs.draft.outputs.archives) }}
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      FILE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.draft.outputs.tag }}

      # The Canvas group needs the pulled layers and the gzip on disk at once.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || github.token }}

      - name: Pull and save ${{ matrix.archive }}
        run: ./scripts/export_images.sh --archive "$FILE" --pull --output-dir out

      - name: Check size and write manifest entry
        id: check
        run: |
          set -euo pipefail
          path="out/${FILE}"
          size="$(stat -c %s "$path")"
          echo "${FILE}: ${size} bytes"

          images="$(./scripts/export_images.sh --list-images "$FILE" | while read -r ref; do
            repo="${ref%:*}"
            digest="$(docker image inspect --format '{{json .RepoDigests}}' "$ref" \
              | jq -r --arg repo "$repo" '[.[] | select(startswith($repo + "@"))][0] // ""')"
            jq -n --arg ref "$ref" --arg digest "$digest" '{ref: $ref, digest: $digest}'
          done | jq -s -c .)"

          mkdir -p manifest
          if [ "$size" -ge "$MAX_ASSET_BYTES" ]; then
            location="${DOWNLOAD_SITE}/${TAG}/app_images/${FILE}"
            echo "::warning::${FILE} is ${size} bytes, at or over the 2 GiB release asset limit. It will not be uploaded. Recorded location: ${location}"
            jq -n --arg file "$FILE" --argjson size "$size" \
              --arg location "$location" --argjson images "$images" \
              '{file: $file, size: $size, omitted: true, location: $location, images: $images}' \
              > "manifest/${FILE}.json"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            jq -n --arg file "$FILE" --argjson size "$size" \
              --arg sha256 "$(sha256sum "$path" | cut -d' ' -f1)" \
              --argjson images "$images" \
              '{file: $file, size: $size, sha256: $sha256, images: $images}' \
              > "manifest/${FILE}.json"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to the draft release
        if: success() && steps.check.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/upload_release_asset.sh "$RELEASE_ID" "out/${FILE}"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.archive }}
          path: manifest/
          retention-days: 7

  finalize:
    name: Publish or delete draft
    needs: [draft, bundle, images]
    if: ${{ always() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      COMMIT: ${{ needs.draft.outputs.commit }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      PREVIOUS_RELEASE_ID: ${{ needs.draft.outputs.previous_release_id }}
      DRAFT_TAG: ${{ needs.draft.outputs.draft_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        if: success() && needs.bundle.result == 'success' && needs.images.result == 'success'
        with:
          ref: refs/tags/${{ needs.draft.outputs.tag }}

      - uses: actions/download-artifact@v4
        if: success() && needs.bundle.result == 'success' && needs.images.result == 'success'
        with:
          pattern: manifest-*
          path: manifest
          merge-multiple: true

      - name: Upload manifest.json and SHA256SUMS
        if: success() && needs.bundle.result == 'success' && needs.images.result == 'success'
        run: |
          set -euo pipefail
          jq -s --arg tag "$TAG" --arg commit "$COMMIT" \
            '{tag: $tag, commit: $commit, created: (now | todate), assets: sort_by(.file)}' \
            manifest/*.json > manifest.json
          # Omitted archives are not on the release, so they are not checksummed here.
          jq -r '.assets[] | select(.omitted != true) | "\(.sha256)  \(.file)"' manifest.json > SHA256SUMS
          cat SHA256SUMS
          ./scripts/upload_release_asset.sh "$RELEASE_ID" manifest.json
          ./scripts/upload_release_asset.sh "$RELEASE_ID" SHA256SUMS

      - name: Publish the release
        id: publish
        if: success() && needs.bundle.result == 'success' && needs.images.result == 'success'
        run: |
          set -euo pipefail

          # Confirm the draft has every attached file before the published
          # release is deleted. The asset list can lag a successful upload.
          jq -r '.assets[] | select(.omitted != true) | .file' manifest.json > /tmp/expected.txt
          printf '%s\n' manifest.json SHA256SUMS >> /tmp/expected.txt
          ok=false
          for attempt in 1 2 3 4 5; do
            gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[].name' \
              | sort > /tmp/actual.txt
            missing=0
            while read -r asset_name; do
              if ! grep -Fxq "$asset_name" /tmp/actual.txt; then
                echo "Not listed yet: ${asset_name}"
                missing=1
              fi
            done < /tmp/expected.txt
            if [ "$missing" -eq 0 ]; then
              ok=true
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" != true ]; then
            echo "::error::Draft ${RELEASE_ID} is missing assets, so the published release was not replaced."
            exit 1
          fi

          body="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq '.body // ""')"
          if jq -e '.assets[] | select(.omitted == true)' manifest.json >/dev/null; then
            extra="$(jq -r '.assets[] | select(.omitted == true) | "- \(.file) (\(.size) bytes): \(.location)"' manifest.json)"
            note="These archives are at or over GitHub's 2 GiB limit and are not attached. Build each one with ./scripts/export_images.sh --archive NAME --pull and upload it to the location below."
            body="${body}"$'\n\n'"${note}"$'\n\n'"${extra}"
          fi

          # Rebuilding an older tag must not take the Latest badge from a
          # newer release. A first publish stays latest. A rebuild stays
          # latest only when it already was. If the lookup fails, leave the
          # badge alone.
          make_latest="true"
          if [ -n "$PREVIOUS_RELEASE_ID" ]; then
            make_latest="false"
            if latest_id="$(gh api "repos/${GH_REPO}/releases/latest" --jq .id)"; then
              if [ "$latest_id" = "$PREVIOUS_RELEASE_ID" ]; then
                make_latest="true"
              fi
            fi
          fi

          old_deleted=false
          if [ -n "$PREVIOUS_RELEASE_ID" ]; then
            echo "Draft ${RELEASE_ID} has every asset. Deleting published release ${PREVIOUS_RELEASE_ID}."
            gh api -X DELETE "repos/${GH_REPO}/releases/${PREVIOUS_RELEASE_ID}" >/dev/null
            old_deleted=true
            echo "old_deleted=true" >> "$GITHUB_OUTPUT"
          fi

          # tag_name is sent on every update. Omitting it clears the tag.
          # make_latest is the string enum the API documents.
          jq -n \
            --arg tag_name "$TAG" \
            --arg name "$TAG" \
            --arg body "$body" \
            --arg make_latest "$make_latest" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false, make_latest: $make_latest}' \
            > /tmp/release.json
          if ! gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" --input /tmp/release.json >/dev/null; then
            if [ "$old_deleted" = true ]; then
              echo "::error::Published release ${PREVIOUS_RELEASE_ID} was deleted, but publishing draft ${RELEASE_ID} failed. That draft still has the new assets. Publish it by hand before re-running."
            else
              echo "::error::Publishing draft ${RELEASE_ID} failed."
            fi
            exit 1
          fi

          if [ "$DRAFT_TAG" != "$TAG" ]; then
            if gh api "repos/${GH_REPO}/git/ref/tags/${DRAFT_TAG}" --jq .ref >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${DRAFT_TAG}" >/dev/null \
                || echo "::warning::Could not delete temporary tag ${DRAFT_TAG}."
            fi
          fi
          echo "Published ${TAG}."

      # The git tag stays, so a failed build number is never reused for a
      # different commit. Delete only the draft created by this run.
      - name: Delete the draft release
        if: >-
          always() &&
          steps.publish.outputs.old_deleted != 'true' &&
          steps.publish.outcome != 'success'
        run: |
          set -euo pipefail
          echo "Bundle: ${{ needs.bundle.result }}. Images: ${{ needs.images.result }}."
          gh api -X DELETE "repos/${GH_REPO}/releases/${RELEASE_ID}" >/dev/null
          if [ "$DRAFT_TAG" != "$TAG" ]; then
            if gh api "repos/${GH_REPO}/git/ref/tags/${DRAFT_TAG}" --jq .ref >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${DRAFT_TAG}" >/dev/null \
                || echo "::warning::Could not delete temporary tag ${DRAFT_TAG}."
            fi
          fi
          if [ -n "$PREVIOUS_RELEASE_ID" ]; then
            echo "::error::Release ${TAG} was not replaced. The published release was left in place and the new draft was deleted."
          else
            echo "::error::Release ${TAG} was not published. The draft was deleted and the tag was kept."
          fi
          exit 1
