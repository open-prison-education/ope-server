    ope-freecodecamp-db:
        image: mongo:8.2
        container_name: ope-freecodecamp-db
        command: mongod --replSet rs0
        network_mode: <NETWORK_MODE>
        restart: always
        volumes:
            - freecodecamp_db:/data/db
        healthcheck:
            test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --quiet
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    ope-freecodecamp:
        build: ./ope-freecodecamp
        image: operepo/ope-freecodecamp
        container_name: ope-freecodecamp
        network_mode: <NETWORK_MODE>
        restart: always
        ports:
            - "3000"
        env_file: .env
        environment:
            - PORT=3000
            - IT_PW=${IT_PW}
            - OFFICE_PW=${OFFICE_PW}
            - VIRTUAL_HOST=freecodecamp.<DOMAIN>
            - VIRTUAL_PORT=3000
            - CERT_NAME=<CERT_NAME>
            - VIRTUAL_PROTO=http
            - MONGOHQ_URL=mongodb://ope-freecodecamp-db:27017/freecodecamp?directConnection=true
            - FREECODECAMP_NODE_ENV=production
            - HOST=0.0.0.0
            - LETSENCRYPT_HOST=freecodecamp.<DOMAIN>
            - LETSENCRYPT_EMAIL=<ALERT_EMAIL>
